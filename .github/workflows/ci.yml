name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install './py/miniconf_doc[dev]'
      - run: python -m ruff format --check py/miniconf_doc
      - run: python -m ruff check py/miniconf_doc
      - run: python -m compileall -q py/miniconf_doc
      - run: python -m build py/miniconf_doc
      - run: python -m pip install --force-reinstall --no-deps py/miniconf_doc/dist/*.whl
      - run: python -I -m pytest -q -n 8 py/miniconf_doc/tests
      - name: Check installed command outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m miniconf_doc --help

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py/miniconf_mqtt/pyproject.toml
      - name: Install Python tools
        working-directory: py/miniconf_mqtt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python
        working-directory: py/miniconf_mqtt
        run: python -m ruff format --check src tests test.py
      - working-directory: py/miniconf_mqtt
        run: python -m ruff check src tests test.py
      - working-directory: py/miniconf_mqtt
        run: python -m compileall src tests test.py
      - working-directory: py/miniconf_mqtt
        run: python -m unittest discover -s tests

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p miniconf --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p miniconf --no-default-features --no-deps

  semver:
    runs-on: ubuntu-latest
    # Breaking changes are documented under UNRELEASED; versions advance at publication.
    # Restore enforcement when preparing that release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: miniconf
          feature-group: all-features

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      - run: cargo build
      - run: cargo build --release
      - run: cargo build --examples
      - run: python3 miniconf_settings/examples/test_shell.py target/debug/examples/shell
      - run: cargo run --example cli -- --output-dac-1 2048
      - run: cargo test --example scpi
      - run: cargo run --example trace --features schema
      - run: cargo run -p miniconf --example packed --no-default-features --features derive,postcard

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - cargo test
          - cargo test --all-features
          - cargo test --no-default-features
          - cargo test -p miniconf --no-default-features
          - cargo test -p miniconf --no-default-features --features schema,derive --lib --test json_schema -- --test-threads=8
    steps:
      - uses: actions/checkout@v7
      - name: Start Broker
        if: ${{ !startsWith(matrix.command, 'cargo test -p miniconf --no-default-features') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          sudo service mosquitto start
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.command }}
      - run: ${{ matrix.command }}
        env:
          BROKER: 127.0.0.1:1883

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py/miniconf_mqtt/pyproject.toml
      - name: Build Python package
        working-directory: py/miniconf_mqtt
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

  test-embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: miniconf/tests/benchmark -> target
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi
      - run: |
          for features in '' tree help tree,help; do
            cargo test --lib --target x86_64-unknown-linux-gnu --features "$features"
          done
        working-directory: miniconf/tests/benchmark
      - run: ./run.sh
        env:
          RUSTFLAGS: -D warnings
        working-directory: miniconf/tests/benchmark

  test-mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Broker
        run: |
          sudo apt-get install mosquitto mosquitto-clients
          sudo service mosquitto start
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh py/miniconf_mqtt/test.sh
