name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py/pyproject.toml
      - name: Install Python tools
        working-directory: py
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"

      - name: Check Python
        working-directory: py
        run: python -m ruff format --check miniconf test.py
      - working-directory: py
        run: python -m ruff check miniconf test.py
      - working-directory: py
        run: python -m compileall miniconf test.py

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p miniconf --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p miniconf --no-default-features --no-deps

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Development stays at the latest published version. Intentional breaking
      # work must select a minor release and document its migration.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: miniconf
          feature-group: all-features
          release-type: patch

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features
      - run: cargo build
      - run: cargo build --release
      - run: cargo build --examples
      - run: cargo run --example cli -- --output-dac-1 2048
      - run: cargo test --example scpi
      - run: cargo run --example trace --features schema
      - run: cargo run -p miniconf --example packed --no-default-features --features derive,postcard

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - cargo test
          - cargo test --all-features
          - cargo test --no-default-features
          - cargo test -p miniconf --no-default-features
    steps:
      - uses: actions/checkout@v6
      - name: Start Broker
        if: matrix.command != 'cargo test -p miniconf --no-default-features'
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          sudo service mosquitto start
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
        env:
          BROKER: 127.0.0.1:1883

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py/pyproject.toml
      - name: Build Python package
        working-directory: py
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:browser
        working-directory: web

  test-embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi
      - run: cargo test --lib --target x86_64-unknown-linux-gnu
        working-directory: miniconf/tests/benchmark
      - run: ./run.sh
        env:
          RUSTFLAGS: -D warnings
        working-directory: miniconf/tests/benchmark

  test-mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start Broker
        run: |
          sudo apt-get install mosquitto mosquitto-clients
          sudo service mosquitto start
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh py/test.sh
