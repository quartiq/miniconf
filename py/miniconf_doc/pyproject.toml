[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miniconf-doc"
version = "0.1.0"
description = "Build settings references from Miniconf schemas and Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py>=4,<5", "mdformat>=1,<2", "mdformat-gfm>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-xdist>=3,<4", "ruff>=0.17,<1", "build>=1"]

[project.urls]
Repository = "https://github.com/quartiq/miniconf/tree/main/py/miniconf_doc"
Issues = "https://github.com/quartiq/miniconf/issues"

[project.scripts]
miniconf-doc = "miniconf_doc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["miniconf_doc*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
